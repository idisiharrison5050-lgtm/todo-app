name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  laravel:
    name: Laravel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite, xml
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Install test support
        run: composer require --dev mockery/mockery:^1.6 --no-interaction --no-progress
      - run: cp .env.example .env
      - run: mkdir -p bootstrap/cache
      - run: touch database/database.sqlite
      - run: php artisan key:generate --force
      - run: php artisan migrate --force
      - name: Install PHPUnit
        run: wget -q https://phar.phpunit.de/phpunit-12.phar -O phpunit.phar
      - name: Run Laravel test suite
        run: php phpunit.phar --configuration phpunit.xml
