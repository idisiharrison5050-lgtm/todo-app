name: todo_mobile
description: "A cross-platform todo and reminder application."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.0.0
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  path: ^1.9.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.1+1

flutter:
  uses-material-design: true
